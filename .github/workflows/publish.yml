name: CI & Publish

on:
  push:
    branches: [main]
    tags:
      - "spa-router-v*"
      - "bind-form-v*"
      - "dom-template-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: "Пакет для публикации"
        type: choice
        required: true
        options:
          - spa-router
          - bind-form
          - dom-template
      bump:
        description: "Версия (для ручного запуска — поднимет версию, закоммитит и создаст тег)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  # Определяет, какие из трёх пакетов затронуты пушем/PR, чтобы ниже
  # запустить тесты только для них, а не для всех трёх сразу.
  changes:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      spa-router: ${{ steps.filter.outputs.spa-router }}
      bind-form: ${{ steps.filter.outputs.bind-form }}
      dom-template: ${{ steps.filter.outputs.dom-template }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spa-router:
              - 'packages/spa-router/**'
              - 'pnpm-lock.yaml'
              - 'scripts/generate-coverage-badge.mjs'
            bind-form:
              - 'packages/bind-form/**'
              - 'pnpm-lock.yaml'
              - 'scripts/generate-coverage-badge.mjs'
            dom-template:
              - 'packages/dom-template/**'
              - 'pnpm-lock.yaml'
              - 'scripts/generate-coverage-badge.mjs'

  test-spa-router:
    needs: changes
    if: needs.changes.outputs.spa-router == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: spa-router-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chepchik/spa-router run build
      - run: pnpm --filter @chepchik/spa-router run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-router-coverage-${{ github.run_id }}
          path: packages/spa-router/coverage/
          if-no-files-found: ignore
          retention-days: 14

  test-bind-form:
    needs: changes
    if: needs.changes.outputs.bind-form == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bind-form-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chepchik/bind-form run build
      - run: pnpm --filter @chepchik/bind-form run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bind-form-coverage-${{ github.run_id }}
          path: packages/bind-form/coverage/
          if-no-files-found: ignore
          retention-days: 14

  test-dom-template:
    needs: changes
    if: needs.changes.outputs.dom-template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dom-template-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chepchik/dom-template run build
      - run: pnpm --filter @chepchik/dom-template run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-template-coverage-${{ github.run_id }}
          path: packages/dom-template/coverage/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # нужно для git push при ручном запуске (workflow_dispatch)
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve package
        id: package
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            name="${{ inputs.package }}"
          else
            tag="${GITHUB_REF_NAME}"
            name="${tag%-v*}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted Publishing (npm OIDC) требует npm >= 11.5.1 — версия, идущая
      # в комплекте с actions/setup-node, может быть старее. npm сам публикует
      # (pnpm publish пока не поддерживает Trusted Publishing так же надёжно).
      - name: Update npm
        run: npm install -g npm@latest

      # Обязательно до бампа версии/создания тега: если тесты упадут, ни коммит
      # с версией, ни тег не должны появиться в истории — падение workflow не
      # должно оставлять за собой "битый" релизный тег.
      - name: Test
        run: pnpm --filter @chepchik/${{ steps.package.outputs.name }} run test:coverage

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          (cd "packages/${{ steps.package.outputs.name }}" && npm version ${{ inputs.bump }} --no-git-tag-version)
          version=$(node -p "require('./packages/${{ steps.package.outputs.name }}/package.json').version")
          tag="${{ steps.package.outputs.name }}-v${version}"

          git add "packages/${{ steps.package.outputs.name }}/package.json"
          git commit -m "chore(${{ steps.package.outputs.name }}): release ${tag}"
          git tag "${tag}"
          git push origin HEAD:main "${tag}"

      - name: Update coverage badge
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/generate-coverage-badge.mjs packages/${{ steps.package.outputs.name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "packages/${{ steps.package.outputs.name }}/coverage-badge.json"
          git diff --staged --quiet || git commit -m "chore(${{ steps.package.outputs.name }}): update coverage badge [skip ci]"
          git push origin HEAD:main

      - name: Build
        run: pnpm --filter @chepchik/${{ steps.package.outputs.name }} run build

      # Аутентификация через Trusted Publisher (OIDC) — NPM_TOKEN больше не нужен.
      # Требует, чтобы для пакета на npmjs.com был настроен Trusted Publisher
      # (Settings → Trusted Publisher → GitHub Actions → этот repo/workflow).
      - name: Publish
        working-directory: packages/${{ steps.package.outputs.name }}
        run: npm publish --access public --provenance
