name: spa-router CI

on:
  push:
    branches: [main]
    paths:
      - "packages/spa-router/**"
      - "package-lock.json"
      - "scripts/generate-coverage-badge.mjs"
      - ".github/workflows/spa-router-ci.yml"
  pull_request:
    paths:
      - "packages/spa-router/**"
      - "package-lock.json"
      - "scripts/generate-coverage-badge.mjs"
      - ".github/workflows/spa-router-ci.yml"
  workflow_dispatch:

concurrency:
  group: spa-router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test spa-router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build spa-router
        run: npm run build --workspace=packages/spa-router

      - name: Run tests with 100% coverage threshold
        run: npm run test:coverage --workspace=packages/spa-router

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-router-coverage-${{ github.run_id }}
          path: packages/spa-router/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate coverage badge data
        run: node scripts/generate-coverage-badge.mjs packages/spa-router

      - name: Commit coverage badge
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/spa-router/coverage-badge.json
          git diff --staged --quiet || git commit -m "chore(spa-router): update coverage badge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
